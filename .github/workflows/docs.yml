name: Docs

# Builds the mdBook documentation site and publishes it to GitHub Pages.
#
# The documentation source lives in the PRIVATE nullhawk-core repo, so this
# workflow checks that out read-only (CORE_READ_TOKEN) and builds docs-site/ from
# it — the public repo's own docs-site/ copy is not used. It is triggered by a
# repository_dispatch (event_type: docs) that nullhawk-core sends when docs-site/
# changes on main, or manually via workflow_dispatch.
#
# Pages must be enabled once in the repo: Settings → Pages → Build and deployment →
# Source: "GitHub Actions".
on:
  repository_dispatch:
    types: [docs]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SOURCE_REPO: Ratul-netizen/nullhawk-core

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: "0.4.40"
    steps:
      - name: Check out docs source (private nullhawk-core)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: main
          token: ${{ secrets.CORE_READ_TOKEN }}
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/bin"
          url="https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz -C "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build
        run: mdbook build docs-site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site/book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
