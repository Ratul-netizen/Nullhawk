[workspace]
resolver = "2"
# Only crates that exist and build are listed. New crates are split out of
# `core/engine` as each milestone lands; see docs/architecture.md.
members = [
    "core/types",
    "core/storage",
    "core/engine",
    "core/http",
    "core/proxy",
    "core/repeater",
    "core/verify",
    "core/scan",
    "core/active",
    "core/fuzz",
    "core/authz",
    "core/crawl",
    "core/browser",
    "core/llm",
    "core/oob",
    "core/query",
    "core/import",
    "core/sequencer",
    "core/ext",
    "core/wasm",
    "core/report",
    "core/recon",
    "apps/cli",
    "apps/mcp",
    "apps/desktop/src-tauri",
]
# The fuzz targets are a package of their own: they need nightly and libfuzzer-sys, and a
# normal build must never pull them in. See fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Ratul-netizen/Nullhawk"
authors = ["Nullhawk contributors"]

[workspace.dependencies]
nullhawk-types = { path = "core/types" }
nullhawk-storage = { path = "core/storage" }
nullhawk-engine = { path = "core/engine" }
nullhawk-http = { path = "core/http" }
nullhawk-proxy = { path = "core/proxy" }
nullhawk-repeater = { path = "core/repeater" }
nullhawk-verify = { path = "core/verify" }
nullhawk-scan = { path = "core/scan" }
nullhawk-active = { path = "core/active" }
nullhawk-fuzz = { path = "core/fuzz" }
nullhawk-authz = { path = "core/authz" }
nullhawk-crawl = { path = "core/crawl" }
nullhawk-browser = { path = "core/browser" }
nullhawk-llm = { path = "core/llm" }
nullhawk-oob = { path = "core/oob" }
nullhawk-query = { path = "core/query" }
nullhawk-import = { path = "core/import" }
nullhawk-sequencer = { path = "core/sequencer" }
nullhawk-ext = { path = "core/ext" }
nullhawk-wasm = { path = "core/wasm" }
nullhawk-report = { path = "core/report" }
nullhawk-recon = { path = "core/recon" }

# Async runtime. Needed at M0 only for the engine trait signatures.
tokio = { version = "1.43", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    # Ctrl-C during an active scan pulls the run's cancel token instead of killing the
    # process, so a tester who wants a scan to stop gets a report of what it had done.
    "signal",
] }
async-trait = "0.1"
# Concurrency without spawning: a bounded set of futures driven on one task, so the
# scheduler can hold borrows across them and stopping needs no cross-thread handshake.
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Regular expressions — match & replace rules on proxied traffic (M7).
regex = "1"

# YAML — OpenAPI/Swagger specs are commonly YAML (M5 importers). Maintained fork of the
# archived serde_yaml.
serde_yaml_ng = "0.10"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# TLS. Pinned to the `ring` provider rather than rustls 0.23's aws-lc-rs default:
# aws-lc-rs needs cmake and NASM at build time, which would make a Windows checkout
# fail for reasons that have nothing to do with Nullhawk.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2.2"
rustls-pki-types = "1.10"
# Mints the interception CA and its per-host leaf certificates.
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
# Certificate validity windows. rcgen takes `time::OffsetDateTime` but does not
# re-export it, so the dependency has to be declared here as well.
time = { version = "0.3", default-features = false, features = ["std"] }
x509-parser = "0.16"

# Content decoding. A hostile server controls these bytes, so both are driven
# incrementally against Limits::check_decompression rather than decoded in one go.
flate2 = "1.0"
brotli = "7.0"

# HTTP/2. The conforming client path (M5.1a) wraps the `h2` crate — the same one
# hyper/reqwest use — for reaching h2-only targets; the adversarial frame-level path
# (M5.1e) is a separate, later concern. `http` supplies the request/response types the
# `h2` API speaks. Both are MIT, compatible with this project's AGPL.
h2 = "0.4"
http = "1"

# Offline licence verification (LIC.a): Ed25519 signatures checked against an embedded
# public key, no phone-home. `ring` is already in the tree via rustls; base64 carries the
# signature and key in the licence file.
ring = "0.17"
base64 = "0.21"

# QR codes for mobile onboarding (apps/desktop): core matrix only, no image/renderer deps.
qrcode = { version = "0.14", default-features = false }

# Credential encryption at rest (core/storage/src/crypt.rs): the data-encryption key
# lives in the OS secret store (Windows Credential Manager / macOS Keychain). Native
# backends only — a headless Linux/CI host uses the NULLHAWK_CREDENTIAL_KEY env instead.
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native"] }

# Hashing (content-addressed blob store)
sha2 = "0.10"
# Only ever a lookup key for the Windows certificate store, never a security
# decision. See core/proxy/src/trust.rs.
sha1 = "0.10"

# Utility
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
bytes = { version = "1.9", features = ["serde"] }

# Desktop shell
tauri = { version = "2.1", features = [] }
tauri-build = { version = "2.0", features = [] }

# Testing
tempfile = "3.14"
proptest = "1.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
# Proxy and fuzzer work is unbearable with unoptimized dependencies, and this costs
# nothing after the first build.
opt-level = 0
[profile.dev.package."*"]
opt-level = 2
