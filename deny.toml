# cargo-deny — the supply-chain gate (LIC.e).
#
# cargo-audit already fails CI on a security advisory. cargo-deny covers the other three
# questions procurement asks of a dependency tree: are the licences compatible with shipping
# under AGPL-3.0, is anything pulled from a source we did not choose, and is the graph free of
# surprises. Licences are the sharp one for an open-core product — a copyleft dependency we
# missed would contradict the commercial licence the paid tier is sold under.

[advisories]
# The RustSec database. cargo-audit is the primary advisory gate; this is kept so a single
# `cargo deny check` covers everything, and yanked crates are surfaced here.
yanked = "warn"

# Accepted advisories, each an *unmaintained* transitive dependency — not a vulnerability — that
# Nullhawk cannot remediate without an upstream change. Listed explicitly (not blanket-downgraded)
# so a NEW unmaintained crate still fails here and forces a deliberate decision. Recorded with
# justification in docs/dependencies.md; re-review when Tauri and the rustls stack update.
ignore = [
    "RUSTSEC-2024-0370", # proc-macro-error: unmaintained, via Tauri's proc-macro deps
    "RUSTSEC-2025-0075", # unic-* (ICU) unmaintained, via Tauri
    "RUSTSEC-2025-0080", # unic-* (ICU) unmaintained, via Tauri
    "RUSTSEC-2025-0081", # unic-* (ICU) unmaintained, via Tauri
    "RUSTSEC-2025-0098", # unic-* (ICU) unmaintained, via Tauri
    "RUSTSEC-2025-0100", # unic-* (ICU) unmaintained, via Tauri
    "RUSTSEC-2025-0134", # rustls-pemfile: unmaintained, superseded by rustls-pki-types
    "RUSTSEC-2024-0436", # paste: unmaintained, via wasmi (the extension WASM interpreter)
    "RUSTSEC-2024-0449", # unsafe-libyaml: unmaintained, via serde_yaml_ng; no maintained YAML stack without it
]

[licenses]
# Anything a dependency is under must be on this list, or carry an explicit exception below.
# These are the permissive and weak-copyleft licences that can be redistributed inside an
# AGPL-3.0 work and under a commercial licence alongside it. A strong-copyleft dependency
# (GPL, AGPL) is deliberately absent: pulling one in is a licensing decision, not a silent
# dependency bump, and it should fail here until it is made deliberately.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
]
confidence-threshold = 0.8

# Nullhawk's own crates are AGPL-3.0 — that is the point. They get a per-crate exception so
# the project licenses itself as it means to, while AGPL-3.0-or-later stays *out* of the
# general allow list, so a copyleft *dependency* (which the commercial tier could not ship)
# still fails here and is a decision someone has to make on purpose.
exceptions = [
    { name = "nullhawk-types", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-storage", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-engine", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-http", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-proxy", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-repeater", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-verify", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-scan", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-active", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-fuzz", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-authz", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-crawl", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-browser", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-llm", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-oob", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-query", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-import", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-sequencer", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-ext", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-wasm", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-report", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-recon", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-cli", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-desktop", allow = ["AGPL-3.0-or-later"] },
    { name = "nullhawk-mcp", allow = ["AGPL-3.0-or-later"] },
]

[bans]
# A duplicate version is a warning, not a failure: they arrive through transitive
# dependencies we do not control, and a permanently red job is one nobody reads. A crate we
# never want is added to `deny` deliberately.
multiple-versions = "warn"
wildcards = "warn"
deny = []

[sources]
# Everything comes from crates.io. An unexpected git or alternative-registry source is how a
# dependency-confusion or typosquat attack reaches the build, so it fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
