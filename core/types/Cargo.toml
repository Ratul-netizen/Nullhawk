[package]
name = "nullhawk-types"
description = "Shared domain model for the Nullhawk security platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Exposes `Verified::from_trusted_finding`, so a test can build a stored finding
# without staging an experiment first. Never enabled by a shipped binary.
test-support = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
bytes.workspace = true
ring.workspace = true

[dev-dependencies]
proptest.workspace = true
# Test-only: build JWT fixtures from readable JSON rather than embedding a token
# literal a secret scanner cannot tell from a live one (docs/dependencies.md).
base64.workspace = true
