nullhawk-recon.workspace = true
nullhawk-llm.workspace = true
nullhawk-oob.workspace = true
nullhawk-fuzz.workspace = true
nullhawk-query.workspace = true
nullhawk-import.workspace = true
nullhawk-sequencer.workspace = true
nullhawk-browser.workspace = true
futures.workspace = true
bytes.workspace = true
chrono.workspace = true
tokio.workspace = true
tauri.workspace = true
serde.workspace = true
serde_json.workspace = true
